[project]
name = "eis-batch-analysis"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "cvxopt>=1.3.3",
    "numpy>=2.5.1",
    "pyimpspec>=5.1.3",
    "pyprobe-data>=2.6.0",
    "pyqtdarktheme-fork>=2.3.6",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    # Already a pyimpspec dependency, but core.circuit_diagram imports it
    # directly to draw the annotated ECM schematics.
    "schemdraw>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "batterydf>=0.1.0",
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
]
