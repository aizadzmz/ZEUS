[project]
name = "ZEUS"
version = "0.4.0"
description = "EIS Batch Analysis Software using pyimpspec's functions to perform KK/Z-HIT, DRT and ECM"
requires-python = ">=3.12"
dependencies = [
    "cvxopt>=1.3.3",
    "numpy>=2.5.1",
    # Upper bound is deliberate: core/_pyimpspec_patches.py rebinds private internals and raises at import if any of them move, so a minor upgrade would take the Validation step out entirely.
    "pyimpspec>=5.1.3,<5.2",
    "pyqtdarktheme-fork>=2.3.6",
    "pyqtgraph>=0.14.0",
    "pyside6-essentials>=6.11.1",
    "schemdraw>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "batterydf>=0.1.0",
    "hatchling>=1.31.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
]
